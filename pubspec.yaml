name: reisetagebuch
description: "A new Flutter project."
publish_to: 'none' # private project

version: 3.0.0+41

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.1.2    # Firebase Auth
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^20.0.0
  cloud_firestore: ^6.1.0
  google_sign_in: ^6.3.0   # Für Google Login
  sign_in_with_apple: ^7.0.1 # Für Apple Login
  font_awesome_flutter: ^10.4.0
  firebase_storage: ^13.0.4
  image_picker: ^1.0.7
  share_plus: ^12.0.1
  purchases_flutter: ^9.9.10
  purchases_ui_flutter: ^9.9.10
  shared_preferences: ^2.2.0
  flutter_colorpicker: ^1.1.0
  flutter_slidable: ^4.0.3
  crop_your_image: ^2.0.0
  cached_network_image: ^3.4.1
  timeago: ^3.3.0
  intl: ^0.20.2
  percent_indicator: ^4.2.2
  video_player: ^2.6.0
  logger: ^2.6.2
  intl_utils: ^2.8.14

